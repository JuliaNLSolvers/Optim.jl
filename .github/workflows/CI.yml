name: CI

on:
  - push
  - pull_request

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every version/OS combination rather than cancelling the rest on the
      # first failure
      fail-fast: false
      matrix:
        version:
          - "min"
          - "lts"
          - "1"
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          # CompatHelper PRs force the newest allowed version of every dependency,
          # which Julia 1.10 cannot install for JET (its last 1.10 release is 0.9.18)
          force_latest_compatible_version: ${{ matrix.version == '1' && 'auto' || 'false' }}
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
